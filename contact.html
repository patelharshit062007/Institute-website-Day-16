<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduTech Institute - Contact Us</title>
  
  <!-- Step 1: Yeh line bohot zaroori hai. Isse CSS attach hoti hai -->
  <link rel="stylesheet" href="style.css" />

  <!-- Font Awesome for navigation icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <!-- Navigation -->
  <header>
    <nav>
      <a href="index.html" class="logo">
        <span class="logo-icon"><i class="fa-solid fa-graduation-cap"></i></span>
        <span>EduTech Institute</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="courses.html">Courses</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
        <li><a href="contact.html" class="btn btn-primary">Apply Now</a></li>
      </ul>
    </nav>
  </header>

  <!-- Step 2: Form ko proper style dene ke liye use main container mein rakhein -->
  <main class="container">
    <h2 style="text-align: center;">Contact Us</h2>
    
    <!-- Yahan Form professional dikhega CSS ki wajah se -->
    <form class="contact-form" onsubmit="alert('Message Sent Successfully!'); return false;">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" required placeholder="Enter your name">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" rows="4" required placeholder="Enter your message"></textarea>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
    </form>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 EduTech Institute. All Rights Reserved.</p>
  </footer>

</body>
</html>
